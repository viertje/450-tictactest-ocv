plugins {
	id 'java'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
}

repositories {
	mavenCentral()
}

// The application version is NOT hard-coded here: the release git tag (vMAJOR.MINOR.PATCH) is
// the single source of truth, and the release workflow passes it in as -PreleaseVersion=1.0.0.
// Local builds without the property produce a clearly-not-a-release 0.0.0-SNAPSHOT. See RELEASE.md.
version = providers.gradleProperty('releaseVersion').getOrElse('0.0.0-SNAPSHOT')

// Executable JAR: `java -jar build/libs/tictactest-<version>.jar`. The game has no runtime
// dependencies (JUnit, AssertJ etc. are test-only), so a plain JAR with a Main-Class entry is
// enough -- no fat/shadow JAR plugin needed.
jar {
	archiveBaseName = 'tictactest'
	manifest {
		attributes 'Main-Class': 'ch.bbw.m450.tictactoe.TicTacToeMain'
	}
}

jacoco {
	toolVersion = '0.8.15'
}

test {
	// E2E tests (tagged "e2e") run in their own task below instead -- they simulate whole games
	// through System.in/System.out and are noticeably slower than a plain unit test, so keeping
	// them out of `test` is what keeps the everyday `./gradlew test` loop fast.
	useJUnitPlatform {
		excludeTags 'e2e'
	}
	finalizedBy jacocoTestReport
}

// Coverage data of BOTH test tasks (unit + E2E). JaCoCo's default only reads the `test` task,
// which would leave everything only the E2E tests exercise (e.g. HumanPlayer's input
// validation) uncovered in the report and in the gate below. Picking up "whatever .exec files
// exist" keeps `./gradlew test` fast (unit data only) while `./gradlew build` sees both.
def allCoverageData = fileTree(layout.buildDirectory).include('jacoco/*.exec')

jacocoTestReport {
	dependsOn test
	executionData.setFrom(allCoverageData)
	// Must see the E2E data too, but without depending on e2eTest -- that would drag the slow
	// E2E suite into every `./gradlew test`.
	mustRunAfter 'e2eTest'    // by name: the task is registered further down in this script
	reports {
		html.required = true
		xml.required = true
	}
}

// End-to-end tests: same source set and classpath as the unit tests, just filtered to the
// "e2e" tag instead, so they get their own Gradle task ("./gradlew e2eTest") and their own CI
// visibility without needing a whole separate source set.
tasks.register('e2eTest', Test) {
	description = 'Runs end-to-end tests that drive the whole game through simulated console I/O.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'e2e'
	}
	// Fail fast on the cheap unit tests before spending time on the slower E2E ones.
	shouldRunAfter test
}

// Wired into `check` (and therefore `build`, which CI already runs) so E2E tests run
// automatically on every push/PR -- no separate CI step needed, and a broken one turns the
// build red exactly like a broken unit test would.
check.dependsOn e2eTest

// Coverage gate: the build fails if branch coverage (unit + E2E tests together) drops below
// 90 %. Part of `check`, so CI fails on it, and with the required `Build & Test` status check
// on main it also blocks the PR merge.
jacocoTestCoverageVerification {
	dependsOn test, e2eTest
	executionData.setFrom(allCoverageData)
	violationRules {
		rule {
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
		}
	}
}
check.dependsOn jacocoTestCoverageVerification

// Mutation testing (PIT via the gradle-pitest-plugin). Where JaCoCo answers
// "which lines ran", PIT answers "did the tests actually notice when the
// logic broke" -- it edits the compiled bytecode (a "mutant", e.g. flips a
// `==` to `!=` or a `>` to `>=`) and reruns the suite; a mutant that still
// passes is a gap the coverage percentage alone can't reveal.
pitest {
	junit5PluginVersion = '1.2.3'
	// PIT itself: the plugin's default (1.22.1) is several releases behind the current 1.30.1.
	pitestVersion = '1.30.1'
	targetClasses = ['ch.bbw.m450.tictactoe.*']
	// Named explicitly rather than a wildcard, so adding the (much slower) E2E suite under
	// ch.bbw.m450.tictactoe.e2e doesn't silently drag it into every PIT run too. Comparing unit
	// vs. E2E mutation coverage is a separate exercise, not done here.
	targetTests = ['ch.bbw.m450.tictactoe.TicTacToeMainTest', 'ch.bbw.m450.tictactoe.players.GreedyPlayerTest',
			'ch.bbw.m450.tictactoe.players.PerfectPlayerTest']
	threads = 4
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
	// Baseline (2026-10-23): 92 % mutation coverage (73 of 79 mutants killed), 100 % test strength.
	// The 6 survivors are all in HumanPlayer, which only the E2E tests execute (not run by PIT).
	// 90 leaves a little room below the baseline: a new class with a couple of untested mutants
	// doesn't fail the build at once, but a real drop in test quality does.
	mutationThreshold = 90
}

dependencies {
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
	// End-to-end console-I/O simulation for the "e2e" tests below (@StdIo / StdIn / StdOut).
	testImplementation 'org.junit-pioneer:junit-pioneer:2.3.0'
	testImplementation 'com.tngtech.archunit:archunit:1.5.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}