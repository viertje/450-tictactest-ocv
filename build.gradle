plugins {
	id 'java'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
}

repositories {
	mavenCentral()
}

// The application version is NOT hard-coded here: the release git tag (vMAJOR.MINOR.PATCH) is
// the single source of truth, and the release workflow passes it in as -PreleaseVersion=1.0.0.
// Local builds without the property produce a clearly-not-a-release 0.0.0-SNAPSHOT. See RELEASE.md.
version = providers.gradleProperty('releaseVersion').getOrElse('0.0.0-SNAPSHOT')

// Executable JAR: `java -jar build/libs/tictactest-<version>.jar`. The game has no runtime
// dependencies (JUnit, AssertJ etc. are test-only), so a plain JAR with a Main-Class entry is
// enough -- no fat/shadow JAR plugin needed.
jar {
	archiveBaseName = 'tictactest'
	manifest {
		attributes 'Main-Class': 'ch.bbw.m450.tictactoe.TicTacToeMain'
	}
}

jacoco {
	toolVersion = '0.8.15'
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
	}
}

// Mutation testing (PIT via the gradle-pitest-plugin). Where JaCoCo answers
// "which lines ran", PIT answers "did the tests actually notice when the
// logic broke" -- it edits the compiled bytecode (a "mutant", e.g. flips a
// `==` to `!=` or a `>` to `>=`) and reruns the suite; a mutant that still
// passes is a gap the coverage percentage alone can't reveal.
pitest {
	junit5PluginVersion = '1.2.3'
	targetClasses = ['ch.bbw.m450.tictactoe.*']
	targetTests = ['ch.bbw.m450.tictactoe.*']
	threads = 4
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
	// No threshold yet -- this first run is to see the baseline mutation
	// score. Once that's known, mutationThreshold can be set to fail the
	// build below it, the same way a coverage gate would.
	mutationThreshold = 0
}

dependencies {
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}