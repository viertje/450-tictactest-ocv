name: Publish container image

on:
  push:
    branches: [ main ]
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/dockerimageupdate.yml
  # Allows a manual rebuild from the Actions tab without changing the Dockerfile.
  # Also how the very first version (v1.0.0) gets bootstrapped, since no Dockerfile
  # change is needed just to start the versioning process.
  workflow_dispatch:

# Two pushes in quick succession must not race each other -- both for :latest and
# for picking the next version number off the tag list.
concurrency:
  group: publish-container-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build, push and tag
    runs-on: ubuntu-latest

    # contents:write is for creating and pushing the new vX.Y.Z git tag.
    permissions:
      contents: write
      packages: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need the full tag history to find the latest vX.Y.Z tag, not just
          # the tip commit.
          fetch-depth: 0

      - name: Determine next version
        id: version
        # Versioning concept: semantic version tags (vMAJOR.MINOR.PATCH) on the
        # image, always bumping PATCH automatically -- see docs/DevContainer-Versioning.md
        # for the reasoning. The git tag itself is the source of truth for "what
        # was the last published version", so nothing needs to be stored twice.
        run: |
          latest=$(git tag --list 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          # :latest stays for convenience/debugging; the commit SHA keeps every
          # image reachable under an immutable tag. Neither of these is what
          # build.yml or devcontainer.json actually pin to -- that's the vX.Y.Z
          # tag below, only once the release PR for it has been merged.
          tags: |
            ghcr.io/viertje/450-tictactest-ocv:latest
            ghcr.io/viertje/450-tictactest-ocv:${{ github.sha }}
            ghcr.io/viertje/450-tictactest-ocv:${{ steps.version.outputs.version }}

      - name: Tag this commit with the new version
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

  open-release-pr:
    name: Open release PR
    needs: publish
    runs-on: ubuntu-latest

    # GITHUB_TOKEN can NEVER be granted write access to .github/workflows/* --
    # there is no permissions: key that unlocks it (an earlier attempt to add
    # 'workflows: write' here was invalid syntax, correctly flagged by IDE
    # schema validation -- no such key exists for GITHUB_TOKEN). The only way
    # around this GitHub-side restriction is a token that isn't GITHUB_TOKEN:
    # see the 'Create pull request' step below, which uses a PAT instead.
    # contents:write / pull-requests:write below are still for GITHUB_TOKEN's
    # own use in the two steps that don't touch build.yml (checkout, closing
    # superseded PRs via gh).
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Close superseded release PRs
        # If a Dockerfile change is pushed again before the previous release PR
        # was merged, that old PR would otherwise sit open forever, pointing at
        # a now-outdated version, and a reviewer could accidentally merge the
        # wrong one. Only one release PR should ever be open at a time, so any
        # earlier one is closed (with an explanatory comment, not silently)
        # before the new one is opened below.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("chore/devcontainer-")) | .number' |
          while read -r pr; do
            echo "Closing superseded release PR #$pr"
            gh pr comment "$pr" --body \
              "Superseded by \`${{ needs.publish.outputs.version }}\`, closing automatically. See docs/DevContainer-Versioning.md."
            gh pr close "$pr"
          done

      - name: Pin devcontainer image to the new version
        # This is the only place the new version becomes "consumable": build.yml
        # (CI) and devcontainer.json (local dev environments) both reference the
        # same ghcr.io/.../450-tictactest-ocv:<tag> string, so one replacement
        # updates both. Until this PR is reviewed and merged, both files keep
        # pointing at the previous, already-released version -- that review/merge
        # step is the official Freigabe. See docs/DevContainer-Versioning.md.
        run: |
          sed -i "s#ghcr.io/viertje/450-tictactest-ocv:[A-Za-z0-9._-]*#ghcr.io/viertje/450-tictactest-ocv:${{ needs.publish.outputs.version }}#" \
            .github/workflows/build.yml \
            .devcontainer/devcontainer.json

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # Must be a PAT with the 'workflow' scope, not GITHUB_TOKEN: this PR's
          # changes touch .github/workflows/build.yml, and GitHub refuses that
          # push from GITHUB_TOKEN unconditionally (see the permissions comment
          # above). Repo secret RELEASE_PAT holds it -- create a classic PAT
          # with 'public_repo' + 'workflow' scopes at
          # https://github.com/settings/tokens, add it under
          # Settings -> Secrets and variables -> Actions -> New repository
          # secret. See docs/DevContainer-Versioning.md.
          token: ${{ secrets.RELEASE_PAT }}
          commit-message: "chore(devcontainer): pin to ${{ needs.publish.outputs.version }}"
          title: "chore(devcontainer): release ${{ needs.publish.outputs.version }}"
          body: |
            Automated release PR, opened after `ghcr.io/viertje/450-tictactest-ocv:${{ needs.publish.outputs.version }}` was built and pushed successfully.

            Pins `build.yml` and `devcontainer.json` to this version.

            **Merging this PR is the official release step.** Until then, CI and local dev
            environments keep using the previously released version -- see
            `docs/DevContainer-Versioning.md`.
          branch: chore/devcontainer-${{ needs.publish.outputs.version }}
          delete-branch: true
