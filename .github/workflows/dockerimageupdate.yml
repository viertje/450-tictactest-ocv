name: Publish container image

on:
  push:
    branches: [ main ]
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/dockerimageupdate.yml
  # Allows a manual rebuild from the Actions tab without changing the Dockerfile.
  workflow_dispatch:

# GITHUB_TOKEN needs write access to publish to the GitHub Container Registry.
permissions:
  contents: read
  packages: write

# Two pushes in quick succession must not race each other to the :latest tag.
concurrency:
  group: publish-container-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          # :latest is what build.yml consumes. The commit SHA is pushed as well,
          # so every image stays reachable under an immutable tag for debugging.
          tags: |
            ghcr.io/viertje/450-tictactest-ocv:latest
            ghcr.io/viertje/450-tictactest-ocv:${{ github.sha }}
