name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # Restricts GITHUB_TOKEN to what this job actually needs.
    # "packages: read" is what allows it to pull the private image below.
    permissions:
      contents: read
      packages: read

    # The job runs inside our own image from the GitHub Container Registry.
    # It already contains JDK 25 (Zulu), so no setup-java step is needed.
    container:
      image: ghcr.io/viertje/450-tictactest-ocv:latest
      # The image declares "USER dev", but the runner creates the job workspace
      # as root -- without this override, checkout fails with "permission denied".
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and run tests
        run: ./gradlew build --no-daemon

      - name: Upload JaCoCo coverage report
        # Runs even if the tests above failed, so a broken build still
        # leaves a coverage report behind for debugging.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
          if-no-files-found: error
