name: Build

on:
  push:
    branches-ignore: [ 'gh-pages' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # contents:write is needed further down to push the updated coverage
    # history to the gh-pages branch (main pushes only).
    permissions:
      contents: write
      packages: read

    # The job runs inside our own image from the GitHub Container Registry.
    # It already contains JDK 25 (Zulu), so no setup-java step is needed.
    container:
      image: ghcr.io/viertje/450-tictactest-ocv:v1.0.1
      # The image declares "USER dev", but the runner creates the job workspace
      # as root -- without this override, checkout fails with "permission denied".
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and run tests
        run: ./gradlew build --no-daemon

      - name: Upload JaCoCo coverage report
        # Runs even if the tests above failed, so a broken build still
        # leaves a coverage report behind for debugging.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
          if-no-files-found: error

      - name: Extract line coverage percentage
        # Only main's coverage gets tracked over time -- a feature branch
        # would pollute the history with numbers nobody wants to compare.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: coverage
        run: |
          COUNTER=$(grep -o '<counter type="LINE"[^>]*/>' build/reports/jacoco/test/jacocoTestReport.xml | tail -1)
          MISSED=$(echo "$COUNTER" | sed -E 's/.*missed="([0-9]+)".*/\1/')
          COVERED=$(echo "$COUNTER" | sed -E 's/.*covered="([0-9]+)".*/\1/')
          PERCENT=$(awk -v c="$COVERED" -v m="$MISSED" 'BEGIN { printf "%.1f", (c / (c + m)) * 100 }')
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Append coverage to history
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "$(date -u +%Y-%m-%d),${GITHUB_SHA::7},${{ steps.coverage.outputs.percent }}" >> gh-pages-branch/coverage-history.csv
          cd gh-pages-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage-history.csv
          git commit -m "Update coverage history: ${{ steps.coverage.outputs.percent }}% (${GITHUB_SHA::7})"
          git push
